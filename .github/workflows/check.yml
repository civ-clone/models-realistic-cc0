name: Check the set on push

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The manifest must describe the models in models/, as roster.json lists them, with their credits and licence.
      - run: python3 -I tools/check.py
      - run: python3 -I -m py_compile tools/*.py tools/blender/*.py
